# Local Jenkins with Docker CLI + host daemon (pipelines use `docker run` / `docker build`).
#
# 1) On Linux, get the host docker group id (needed so user `jenkins` can use the socket):
#      export DOCKER_GID=$(getent group docker | cut -d: -f3)
#    On Docker Desktop (Mac/Windows) you can often omit group_add or use 0 — if permission denied, try:
#      export DOCKER_GID=0
#
# 2) From repo root:
#      docker compose -f jenkins/compose.yaml build
#      docker compose -f jenkins/compose.yaml up -d
#
# 3) Open http://localhost:8080 and finish setup.

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-jenkins:local
    container_name: pipeline-jenkins-1
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"

volumes:
  jenkins_home:
