# Use your machine’s Docker Engine from inside Jenkins:
#   1) Build THIS image (includes `docker` CLI). Do not use plain jenkins/jenkins for docker pipelines.
#   2) The socket line below forwards all `docker` commands to the host daemon.
#   3) Linux: set DOCKER_GID so user `jenkins` may open the socket:
#        export DOCKER_GID=$(getent group docker | cut -d: -f3)
#      Docker Desktop (Mac/Windows): often `export DOCKER_GID=0` if you get permission denied.
#
# From repo root:
#   docker compose -f jenkins/compose.yaml build
#   docker compose -f jenkins/compose.yaml up -d
#
# Open http://localhost:8080 — in a pipeline shell, `docker info` should work.

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
      args:                          # ← add this block
        DOCKER_GID: "${DOCKER_GID:-999}"
    image: project-jenkins:local
    container_name: pipeline-jenkins-1
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"        # ← runtime group membership

volumes:
  jenkins_home: